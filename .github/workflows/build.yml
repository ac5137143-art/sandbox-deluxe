name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: tests + APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-

      # The project has no wrapper jar, so Gradle is installed explicitly.
      - name: Install Gradle 8.13
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Engine tests (:core:test)
        run: gradle --no-daemon --console=plain :core:test

      - name: Build debug APK
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandboxDeluxe-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SandboxDeluxe.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SandboxDeluxe.apk \
            --title "Sandbox Deluxe — latest build" \
            --notes "Автоматическая сборка из коммита ${{ github.sha }}.

Внутри: движок клеточного автомата с термодинамикой, фазовыми переходами,
химией и взрывами. Подписан автоматическим debug-ключом, установка разрешена.

Установка: скачать APK на телефоне и разрешить установку из этого источника."
