name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: tests + APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.9 and Kotlin 2.1 need a JDK 17/21 toolchain; the runner default is newer.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The real work happens in scripts/ci-build.sh so that the full output of a failing run
      # always lands in ci-build.log and can be published below.
      - name: Tests and APK
        run: bash scripts/ci-build.sh 2>&1 | tee ci-build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SandboxDeluxe-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SandboxDeluxe.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SandboxDeluxe.apk \
            --title "Sandbox Deluxe - latest build" \
            --notes "Автоматическая сборка из коммита ${{ github.sha }}. Движок клеточного автомата с термодинамикой, фазовыми переходами, химией и взрывами. Подписан автоматическим debug-ключом."

      # Keeps the build log of a failed run readable from outside the repository.
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p ci
          tail -c 300000 ci-build.log > ci/last-build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/last-build.log
          git commit -m "ci: build log from failed run [skip ci]" || true
          git push || true
