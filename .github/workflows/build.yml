name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: tests + APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Toolchain info
        continue-on-error: true
        run: |
          set -x
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager || true
          ls "$ANDROID_SDK_ROOT" 2>&1 || true
          ls "$ANDROID_SDK_ROOT/platforms" 2>&1 || true
          ls "$ANDROID_SDK_ROOT/build-tools" 2>&1 || true

      - name: Install SDK packages
        run: |
          set -x
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-

      # The project has no wrapper jar, so Gradle is installed explicitly.
      - name: Install Gradle 8.13
        run: |
          set -x
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"
          ./gradle-8.13/bin/gradle --version

      - name: Engine tests (:core:test)
        run: gradle --no-daemon --console=plain :core:test 2>&1 | tee ci-build.log

      - name: Build debug APK
        run: gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee -a ci-build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SandboxDeluxe-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SandboxDeluxe.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SandboxDeluxe.apk --title "Sandbox Deluxe - latest build" --notes "Автоматическая сборка из коммита ${{ github.sha }}. Движок клеточного автомата с термодинамикой, фазовыми переходами, химией и взрывами. Подписан автоматическим debug-ключом."

      # Keeps the build log of a failed run readable from outside the repository.
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p ci
          tail -c 300000 ci-build.log > ci/last-build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/last-build.log
          git commit -m "ci: build log from failed run [skip ci]" || true
          git push || true
